<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Professional portfolio showcasing projects, skills, and achievements">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kunj Shingala">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Kunj Shingala</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #0a0a0a;
      margin: 0;
      overflow: hidden;
    }

    .loading-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease-in-out;
    }

    .loading-container.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .logo-image {
      width: 120px;
      height: auto;
      margin-bottom: 24px;
      animation: pulse 1.2s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% { 
        transform: scale(0.95); 
        opacity: 0.8; 
        filter: drop-shadow(0 0 0 rgba(255, 255, 255, 0));
      }
      100% { 
        transform: scale(1.05); 
        opacity: 1; 
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2)); 
      }
    }

    .loading-dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      background-color: #ffffff;
      border-radius: 50%;
      opacity: 0.7;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) {
      animation-delay: -0.32s;
    }

    .dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: scale(0);
        opacity: 0.3;
      }

      40% {
        transform: scale(1);
        opacity: 1;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }
    }
  </style>
</head>

<body>
  <div class="loading-container">
    <img src="icons/Icon-192.png" alt="09 Logo" class="logo-image" />
    <div class="loading-dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    // Watch for Flutter's glass-pane (canvas container) to be added to the DOM
    window.addEventListener('load', function () {
      var loadingContainer = document.querySelector('.loading-container');
      var observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          if (mutation.addedNodes) {
            for (var i = 0; i < mutation.addedNodes.length; i++) {
              var node = mutation.addedNodes[i];
              // Flutter web wraps its canvas in a flutter-view or flt-glass-pane element
              if (node.tagName === 'FLT-GLASS-PANE' || node.tagName === 'FLUTTER-VIEW') {
                // Slight delay to ensure Flutter has painted its first frame
                setTimeout(function () {
                  loadingContainer.classList.add('fade-out');
                  setTimeout(function () {
                    loadingContainer.remove();
                  }, 800); // Wait for transition to finish before removing from DOM
                }, 100);
                observer.disconnect();
                return;
              }
            }
          }
        });
      });
      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
